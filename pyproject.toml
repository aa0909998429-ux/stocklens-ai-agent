[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "stocklens-ai-agent"
version = "0.1.0"
description = "Educational historical stock-data analysis agent prototype"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "gradio>=5,<7",
  "numpy>=2,<2.4",
  "pandas>=2,<3",
  "plotly>=6,<7",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

